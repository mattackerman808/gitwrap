name: Release

# Push a tag like v0.2.0 to test, package and publish a GitHub Release.
on:
  push:
    tags: ["v*"]

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches package version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/gitwrap/__init__.py)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match __version__ $version"
            exit 1
          fi

      - name: Build zip
        run: scripts/package.sh "$GITHUB_REF_NAME"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "gitwrap $GITHUB_REF_NAME" --generate-notes
